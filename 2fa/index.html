<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2FA 验证码生成器</title>

<script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>


<style>

:root {

    --main:#d34d7d;
    --light:#fde7ef;
    --border:#f2d8e3;
    --bg:#fff8fa;

}



* {

    margin:0;
    padding:0;
    box-sizing:border-box;

    -webkit-tap-highlight-color:transparent;

    font-family:

    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;

}



body {

    min-height:100vh;

    background:

    linear-gradient(
        rgba(255,248,250,.94),
        rgba(255,248,250,.94)
    ),

    radial-gradient(
        circle at top right,
        #ffd5e5,
        transparent 40%
    );

    color:#33252b;

    overflow-x:hidden;

    padding:40px 20px;

}



/* 背景光晕 */


body::before {

    content:"";

    position:fixed;

    width:420px;

    height:420px;

    right:-150px;

    top:-150px;

    border-radius:50%;

    background:#ffd5e5;

    filter:blur(90px);

    opacity:.6;

    z-index:-1;

}



body::after {

    content:"";

    position:fixed;

    inset:0;

    background-image:

    radial-gradient(
        rgba(210,90,130,.08) 1px,
        transparent 1px
    );

    background-size:20px 20px;

    pointer-events:none;

    opacity:.35;

    z-index:-1;

}



.container {

    width:min(480px,100%);

    margin:35px auto;

}



.card {

    background:

    rgba(255,255,255,.9);


    border:1px solid var(--border);


    border-radius:24px;


    padding:28px 24px;


    box-shadow:

    0 15px 40px rgba(200,80,120,.12);

}



.title {

    font-size:30px;

    font-weight:700;

    letter-spacing:-1px;

    color:var(--main);

    text-align:center;

    margin-bottom:30px;

}



.form-item {

    margin-bottom:18px;

}



.form-item label {

    display:block;

    margin-bottom:10px;

    color:#8d767f;

    font-size:14px;

}



.form-item input {

    width:100%;

    padding:15px 16px;

    border-radius:16px;

    border:1px solid var(--border);

    outline:none;

    background:white;

    font-size:15px;

    transition:.25s;

}



.form-item input:focus {

    border-color:var(--main);

    box-shadow:

    0 0 0 4px rgba(211,77,125,.12);

}



.btn-group {

    display:flex;

    gap:14px;

    margin:25px 0;

}



button {

    flex:1;

    padding:15px;

    border:none;

    border-radius:18px;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

}



.btn-primary {

    background:var(--main);

    color:white;

}



.btn-primary:active {

    transform:scale(.97);

}



.btn-default {

    background:var(--light);

    color:var(--main);

}



.code-box {

    background:white;

    border:1px solid var(--border);

    border-radius:22px;

    padding:28px 20px;

    text-align:center;

}



.code {

    font-size:42px;

    font-weight:700;

    letter-spacing:8px;

    color:#422630;

}



.info {

    margin-top:12px;

    justify-content:center;

    display:flex;

    color:#9b858d;

    font-size:14px;

}



.tip {

    margin-top:18px;

    text-align:center;

    color:#d34d7d;

    font-size:14px;

}



.error {

    color:#ef4444;

}



.footer {

    text-align:center;

    margin-top:40px;

    color:#c2a8b1;

    font-size:13px;

}



</style>

</head>


<body>


<div id="app" class="container">


<div class="card">


<div class="title">
2FA 验证码生成器
</div>



<div class="form-item">


<label>
2FA 密钥（Base32）
</label>


<input

v-model="form.secret"

placeholder="输入或粘贴密钥，自动去空格"

@blur="handleBlur"

/>


</div>



<div class="btn-group">


<button

class="btn-primary"

@click="submit">

生成验证码

</button>



<button

class="btn-default"

@click="clearForm">

清空

</button>


</div>



<div

class="code-box"

v-if="tableData.length">


<div class="code">

{{ tableData[0].code }}

</div>


<div class="info">

<span>

剩余 {{ tableData[0].remaining }} 秒

</span>

</div>


</div>



<div

class="tip"

:class="{error:isError}"

v-if="tipText">

{{tipText}}

</div>


</div>



<div class="footer">

© 2026 2FA 工具

</div>


</div>
<script>


const TOTP = {


    base32Decode(secret) {


        const base32Chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";


        let bits = "";


        for (let i = 0; i < secret.length; i++) {


            const val = base32Chars.indexOf(
                secret[i].toUpperCase()
            );


            if (val === -1) {

                throw new Error("非法 Base32 字符");

            }


            bits += val.toString(2).padStart(5,"0");

        }



        const bytes = [];


        for (
            let i = 0;
            i + 8 <= bits.length;
            i += 8
        ) {


            bytes.push(
                parseInt(
                    bits.substr(i,8),
                    2
                )
            );


        }


        return new Uint8Array(bytes);


    },



    async hmacSha1(key,data){


        const cryptoKey = await crypto.subtle.importKey(


            "raw",

            key,

            {
                name:"HMAC",
                hash:"SHA-1"
            },

            false,

            ["sign"]

        );



        const signature =
        await crypto.subtle.sign(

            "HMAC",

            cryptoKey,

            data

        );



        return new Uint8Array(signature);


    },



    async generate(
        secret,
        step=30,
        digits=6
    ){


        const key =
        this.base32Decode(
            secret.replace(/\s+/g,"")
        );



        const epoch =
        Math.floor(
            Date.now()/1000/step
        );



        const data =
        new ArrayBuffer(8);



        const view =
        new DataView(data);



        view.setUint32(
            4,
            epoch,
            false
        );



        const hmac =
        await this.hmacSha1(

            key,

            new Uint8Array(data)

        );



        const offset =
        hmac[
            hmac.length-1
        ] & 0x0f;



        const code =

        (

            (

                ((hmac[offset]&0x7f)<<24)

                |

                ((hmac[offset+1]&0xff)<<16)

                |

                ((hmac[offset+2]&0xff)<<8)

                |

                (hmac[offset+3]&0xff)

            )

            %

            Math.pow(10,digits)

        );



        return code
        .toString()
        .padStart(digits,"0");


    }


};





new Vue({


    el:"#app",



    data(){


        return {


            form:{

                secret:""

            },


            tableData:[],


            timer:null,


            isFetching:false,


            tipText:"",


            isError:false


        };


    },



    methods:{



        handleBlur(){


            if(!this.form.secret){


                this.setTip(
                    "请输入2FA密钥",
                    true
                );


            }


        },




        setTip(
            text,
            error=false
        ){


            this.tipText=text;


            this.isError=error;



            setTimeout(()=>{


                this.tipText="";


            },2000);


        },





        clearForm(){


            this.form.secret="";


            this.tableData=[];



            if(this.timer){


                clearInterval(
                    this.timer
                );


            }



            this.isFetching=false;



            this.setTip(
                "已清空"
            );


        },





        async submit(){


            if(!this.form.secret){


                this.setTip(
                    "请输入2FA密钥",
                    true
                );


                return;


            }



            this.fetchCode();


        },





        async fetchCode(
            isAuto=false
        ){


            if(this.isFetching)
            return;



            this.isFetching=true;



            try{


                const secret =
                this.form.secret
                .replace(/\s+/g,"")
                .trim();



                const code =
                await TOTP.generate(
                    secret
                );



                this.updateTable(
                    code,
                    secret
                );



                this.copyCode(code);



                if(!isAuto){


                    this.setTip(
                        "验证码已生成并复制"
                    );


                }



            }catch(err){



                console.error(err);



                if(!isAuto){


                    this.setTip(
                        "密钥格式错误",
                        true
                    );


                }


            }
            finally{


                this.isFetching=false;


            }


        },





        updateTable(
            code,
            key
        ){


            if(this.timer){


                clearInterval(
                    this.timer
                );


            }



            const updateAction =
            ()=>{



                const epoch =
                Math.floor(
                    Date.now()/1000
                );



                const timeLeft =
                30 -
                (
                    epoch % 30
                );



                this.tableData=[{


                    code,


                    remaining:timeLeft,


                    key



                }];



                if(
                    timeLeft===30
                ){


                    this.fetchCode(true);


                }


            };



            updateAction();



            this.timer =
            setInterval(
                updateAction,
                1000
            );


        },





        async copyCode(code){


            try{


                await navigator.clipboard.writeText(
                    code
                );


            }catch(err){


                const input =
                document.createElement(
                    "input"
                );


                input.value=code;



                document.body.appendChild(
                    input
                );


                input.select();



                document.execCommand(
                    "copy"
                );



                document.body.removeChild(
                    input
                );


            }


        }


    },




    beforeDestroy(){


        if(this.timer){


            clearInterval(
                this.timer
            );


        }


    }



});



</script>


</body>
</html>
