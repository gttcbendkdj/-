<style>

:root{

    --main:#d34d7d;
    --light:#fde7ef;
    --border:#f2d8e3;
    --text:#422630;
    --sub:#8d767f;

}



*{

    margin:0;
    padding:0;
    box-sizing:border-box;

    -webkit-tap-highlight-color:transparent;

    font-family:

    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;

}



body{

    min-height:100vh;

    background:

    linear-gradient(
        rgba(255,248,250,.94),
        rgba(255,248,250,.94)
    ),

    radial-gradient(
        circle at top right,
        #ffd5e5,
        transparent 45%
    );


    color:var(--text);

    padding:40px 18px;

    overflow-x:hidden;

}



body::after{

    content:"";

    position:fixed;

    inset:0;


    background-image:

    radial-gradient(
        rgba(210,90,130,.08) 1px,
        transparent 1px
    );


    background-size:20px 20px;

    opacity:.35;

    pointer-events:none;

    z-index:-1;

}




.container{

    width:min(600px,100%);

    margin:auto;

}





.header{

    text-align:center;

    margin-bottom:38px;

}



.header h1{

    color:var(--main);

    font-size:36px;

    font-weight:700;

    letter-spacing:-1px;

}



.header p{

    margin-top:12px;

    color:var(--sub);

    font-size:15px;

}





.tools-grid{

    display:flex;

    flex-direction:column;

    gap:16px;

}




.tool-card{


    display:flex;

    align-items:center;


    padding:20px;


    background:

    rgba(255,255,255,.9);


    border:1px solid var(--border);


    border-radius:22px;


    text-decoration:none;


    color:inherit;


    box-shadow:

    0 10px 30px rgba(200,80,120,.08);


    transition:.25s ease;


    position:relative;


    overflow:hidden;


}





.tool-card:hover{


    transform:translateY(-4px);


    box-shadow:

    0 16px 35px rgba(200,80,120,.15);


}





.tool-card:active{


    transform:scale(.98);


    background:white;


}






.tool-icon{


    width:50px;

    height:50px;


    border-radius:16px;


    background:

    linear-gradient(
        145deg,
        #d34d7d,
        #ed8aaa
    );


    display:flex;


    align-items:center;


    justify-content:center;


    flex-shrink:0;


    box-shadow:

    0 8px 18px rgba(211,77,125,.25);


}






.tool-icon svg{


    width:26px;

    height:26px;


    fill:white;


}






.tool-content{


    flex:1;

    margin-left:16px;


}





.tool-content h3{


    font-size:17px;

    font-weight:600;


    color:#422630;


    margin-bottom:6px;


}





.tool-content p{


    font-size:13px;


    color:#9b858d;


    line-height:1.5;


}





.loader-circle{


    width:22px;

    height:22px;


    border-radius:50%;


    border:3px solid #fde7ef;


    border-top-color:var(--main);


    animation:spin .7s linear infinite;


    display:none;


}





@keyframes spin{


    from{

        transform:rotate(0deg);

    }


    to{

        transform:rotate(360deg);

    }


}





.footer{


    text-align:center;


    margin-top:50px;


    color:#c2a8b1;


    font-size:13px;


}




@media(max-width:600px){



    body{

        padding:30px 15px;

    }



    .header h1{

        font-size:30px;

    }



    .tool-card{

        padding:17px;

    }



    .tool-icon{

        width:44px;

        height:44px;

    }



    .tool-content h3{

        font-size:16px;

    }



}



</style>

</head>

<script>


const cards =
document.querySelectorAll(".tool-card");



cards.forEach((card,index)=>{


card.addEventListener(
"click",
function(e){


e.preventDefault();



const url =
this.dataset.url;



const loader =
this.querySelector(".loader-circle");



loader.style.display="block";



setTimeout(()=>{


loader.style.display="none";

}else{


window.open(

);
