<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>导航中心</title>


<style>

:root {

    --main:#d34d7d;
    --light:#fde7ef;
    --border:#f2d8e3;
    --bg:#fff8fa;

}



* {

    box-sizing:border-box;

}



* {
    -webkit-tap-highlight-color: transparent;
}



body {

    margin:0;

    min-height:100vh;


    background:

    linear-gradient(
        rgba(255,248,250,.94),
        rgba(255,248,250,.94)
    ),
    url("data:image/svg+xml,%3Csvg width='120' height='120' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/%3E%3C/filter%3E%3Crect width='120' height='120' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E");


    color:#33252b;


    font-family:

    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;


    overflow-x:hidden;

}



/* 背景光效 */


.bg-circle {

    position:fixed;

    border-radius:50%;

    filter:blur(90px);

    z-index:-2;

}



.circle-one {

    width:430px;

    height:430px;

    top:-180px;

    right:-130px;


    background:#ffd5e5;

    opacity:.6;

}



.circle-two {

    width:380px;

    height:380px;

    bottom:-150px;

    left:-120px;


    background:#f8c8da;

    opacity:.45;

}



/* 点状纸张纹理 */


body::after {

    content:"";

    position:fixed;

    inset:0;


    background-image:

    radial-gradient(
        rgba(210,90,130,.08) 1px,
        transparent 1px
    );


    background-size:20px 20px;


    opacity:.35;


    pointer-events:none;

    z-index:-1;

}




.container {


    width:min(680px,calc(100% - 40px));


    margin:70px auto;


}




/* 顶部 */


.header {


    display:flex;


    justify-content:space-between;


    align-items:flex-start;


    margin-bottom:40px;


}



.name {


    font-size:38px;


    font-weight:700;


    letter-spacing:-1.5px;


    color:var(--main);


}



.desc {


    margin-top:12px;


    color:#8d767f;


    font-size:15px;


    line-height:1.8;


}



.time {


    padding:10px 14px;


    background:white;


    border:1px solid var(--border);


    border-radius:15px;


    font-size:13px;


    color:#8d767f;


    box-shadow:

    0 6px 18px rgba(200,80,120,.08);

}



/* 导航 */


.links {


    display:flex;


    flex-direction:column;


    gap:16px;


}





.card {


    display:flex;


    justify-content:space-between;


    align-items:center;


    padding:21px 22px;


    background:

    rgba(255,255,255,.9);


    border:1px solid var(--border);


    border-radius:22px;


    text-decoration:none;


    color:inherit;


    box-shadow:


    0 10px 30px rgba(200,80,120,.08);


    transition:.25s ease;


}



.card:hover {


    transform:translateY(-4px);


    box-shadow:


    0 16px 35px rgba(200,80,120,.15);


    border-color:#edb3c9;


}




.title {


    font-size:16px;


    font-weight:600;


    color:#422630;


}



.small {


    margin-top:7px;


    font-size:13px;


    color:#9b858d;


}



.arrow {


    width:36px;


    height:36px;


    display:flex;


    align-items:center;


    justify-content:center;


    border-radius:50%;


    background:var(--light);


    color:var(--main);


    font-size:18px;


}





.footer {


    margin-top:60px;


    text-align:center;


    font-size:13px;


    color:#c2a8b1;


}




@media(max-width:600px){


    .container {

        margin-top:45px;

    }



    .header {

        flex-direction:column;

        gap:18px;

    }



    .name {

        font-size:30px;

    }


    .card {

        padding:18px;

    }

}



</style>


</head>
